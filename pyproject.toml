[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexora-data"
version = "0.1.0"
description = "SQL metadata discovery and selective Bronze Parquet extraction"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0,<3", "pyarrow>=19,<26", "pydantic>=2.10,<3", "dash>=3,<5", "boto3>=1.35,<2", "gunicorn>=23,<26", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
mssql = ["pyodbc>=5.2,<6"]

[project.scripts]
nexora-data = "nexora.src.cli:main"
nexora-demo = "nexora.src.demo.generate:main"
nexora-dash = "nexora.src.dash_ui.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "moto[s3]>=5,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["nexora"]
