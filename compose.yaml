name: nexora-data
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run python scripts/configure_local.py}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python scripts/configure_local.py}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run python scripts/configure_local.py}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python scripts/configure_local.py}
      NEXORA_S3_BUCKET: ${NEXORA_S3_BUCKET:-nexora-data}
      NEXORA_S3_ACCESS_KEY: ${NEXORA_S3_ACCESS_KEY:?Run python scripts/configure_local.py}
      NEXORA_S3_SECRET_KEY: ${NEXORA_S3_SECRET_KEY:?Run python scripts/configure_local.py}
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    volumes:
      - ./docker/init-minio.sh:/init-minio.sh:ro
  app:
    build: .
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      NEXORA_DEMO: ${NEXORA_DEMO:-0}
      NEXORA_SOURCE_URL: ${NEXORA_SOURCE_URL:-}
      NEXORA_S3_ENDPOINT: http://minio:9000
      NEXORA_S3_BUCKET: ${NEXORA_S3_BUCKET:-nexora-data}
      NEXORA_S3_ACCESS_KEY: ${NEXORA_S3_ACCESS_KEY:?Run python scripts/configure_local.py}
      NEXORA_S3_SECRET_KEY: ${NEXORA_S3_SECRET_KEY:?Run python scripts/configure_local.py}
    ports:
      - "127.0.0.1:8051:8051"
    volumes:
      - demo-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8051/_dash-layout', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
volumes:
  minio-data:
  demo-data:
